[tool.poetry]
name = "tender-compliance-validator"
version = "0.1.0"
description = "AI-powered tender compliance validation system"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "backend" }, { include = "frontend" }]

[tool.poetry.dependencies]
python = "^3.11"
groq = "^0.9.0"
sentence-transformers = "^3.0.0"
chromadb = "^0.5.0"
pymupdf = "^1.24.0"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.0"
aiosqlite = "^0.20.0"
streamlit = "^1.35.0"
reportlab = "^4.2.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
torch = { version = "^2.3.0", extras = [] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
ruff = "^0.4.0"

[tool.poetry.scripts]
start-backend = "backend.main:start"
start-frontend = "frontend.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]